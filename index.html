<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hann TrackStat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

<h1>Overview</h1>

<div class="top">
<span id="clock">Loading...</span>
<button onclick="updateTime()">Refresh</button>
</div>

<div class="card slot">
<div class="title">SLOT AKUN</div>
<div class="value">0 / 5</div>
<div class="bar">
<div class="fill"></div>
</div>
<p>5 slot tersisa</p>
</div>

<div class="grid">

<div class="card">
<p>ONLINE</p>
<h2>0 / 10</h2>
</div>

<div class="card">
<p>Gems💎</p>
<h2>57</h2>
</div>

<div class="card">
<p>Traits Roll💍</p>
<h2>11</h2>
</div>

<div class="card">
<p>Money💵</p>
<h2>0</h2>
</div>

<div class="card">
<p>Potion</p>
<h2>0</h2>
</div>

<div class="card">
<p>Jackpot</p>
<h2>4</h2>
</div>

</div>

<div class="nav">
<button class="active">Overview</button>
<button>Inventory</button>
<button>Booth</button>
<button>Tambah Slot</button>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
